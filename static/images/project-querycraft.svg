<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="qc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#qc-bg)" />

  <!-- ER Diagram Grid Pattern -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <pattern id="qc-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" />
    </pattern>
    <rect width="960" height="540" fill="url(#qc-grid)" />
  </g>

  <!-- Window Container -->
  <g transform="translate(40, 30)">
    <rect width="880" height="480" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="880" height="42" rx="12" fill="#1E293B" />
    <rect y="32" width="880" height="10" fill="#1E293B" />
    <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="60" cy="21" r="5.5" fill="#10B981" />

    <rect x="250" y="10" width="380" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="440" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
      querycraft.dev/schema/production-cluster
    </text>

    <!-- Header bar -->
    <rect x="0" y="42" width="880" height="48" fill="#141E33" stroke="#334155" stroke-width="1" />
    <text x="24" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">
      QueryCraft · PostgreSQL Schema Graph &amp; EXPLAIN ANALYZE
    </text>

    <!-- Schema Entities / ER Table Cards -->
    <g transform="translate(24, 106)">
      <!-- Table 1: users -->
      <g transform="translate(0, 0)">
        <rect width="210" height="180" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
        <rect width="210" height="34" rx="8" fill="#0369A1" />
        <rect y="24" width="210" height="10" fill="#0369A1" />
        <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">
          auth_user
        </text>

        <g transform="translate(14, 46)" font-family="'JetBrains Mono', monospace" font-size="10">
          <text y="14" fill="#FCD34D">PK id: UUID</text>
          <text y="34" fill="#F8FAFC">username: VARCHAR(150)</text>
          <text y="54" fill="#F8FAFC">email: VARCHAR(255)</text>
          <text y="74" fill="#94A3B8">password_hash: TEXT</text>
          <text y="94" fill="#10B981">is_active: BOOLEAN</text>
          <text y="114" fill="#94A3B8">date_joined: TIMESTAMPTZ</text>
        </g>
      </g>

      <!-- Connecting line 1 to 2 -->
      <path d="M 210 50 C 270 50, 270 80, 330 80" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4" />
      <circle cx="210" cy="50" r="3" fill="#38BDF8" />
      <circle cx="330" cy="80" r="3" fill="#38BDF8" />

      <!-- Table 2: organizations -->
      <g transform="translate(330, 10)">
        <rect width="230" height="190" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
        <rect width="230" height="34" rx="8" fill="#4338CA" />
        <rect y="24" width="230" height="10" fill="#4338CA" />
        <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">
          tenant_organization
        </text>

        <g transform="translate(14, 46)" font-family="'JetBrains Mono', monospace" font-size="10">
          <text y="14" fill="#FCD34D">PK id: UUID</text>
          <text y="34" fill="#38BDF8">FK owner_id -> auth_user</text>
          <text y="54" fill="#F8FAFC">slug: VARCHAR(80) UNIQUE</text>
          <text y="74" fill="#F8FAFC">tier: VARCHAR(30)</text>
          <text y="94" fill="#F8FAFC">max_seats: INTEGER</text>
          <text y="114" fill="#10B981">created_at: TIMESTAMPTZ</text>
          <text y="130" fill="#94A3B8">INDEX (slug, tier)</text>
        </g>
      </g>

      <!-- Connecting line 2 to 3 -->
      <path d="M 560 90 C 600 90, 600 60, 640 60" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="4" />
      <circle cx="560" cy="90" r="3" fill="#818CF8" />
      <circle cx="640" cy="60" r="3" fill="#818CF8" />

      <!-- Table 3: audit_logs -->
      <g transform="translate(640, 0)">
        <rect width="190" height="180" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
        <rect width="190" height="34" rx="8" fill="#047857" />
        <rect y="24" width="190" height="10" fill="#047857" />
        <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">
          audit_event_log
        </text>

        <g transform="translate(14, 46)" font-family="'JetBrains Mono', monospace" font-size="10">
          <text y="14" fill="#FCD34D">PK id: BIGSERIAL</text>
          <text y="34" fill="#38BDF8">FK tenant_id -> org</text>
          <text y="54" fill="#F8FAFC">action: VARCHAR(100)</text>
          <text y="74" fill="#F8FAFC">payload: JSONB</text>
          <text y="94" fill="#10B981">timestamp: TIMESTAMPTZ</text>
          <text y="114" fill="#FCD34D">GIN INDEX (payload)</text>
        </g>
      </g>
    </g>

    <!-- Bottom Query Execution & EXPLAIN Workbench -->
    <g transform="translate(24, 320)">
      <rect width="832" height="136" rx="8" fill="#0B1220" stroke="#334155" stroke-width="1" />
      <rect width="832" height="28" rx="8" fill="#141E33" />
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">
        SQL Query Editor &amp; Cost Optimizer (Index Scan)
      </text>

      <g transform="translate(14, 42)" font-family="'JetBrains Mono', monospace" font-size="11">
        <text y="14" fill="#F8FAFC">
          <tspan fill="#38BDF8">EXPLAIN (ANALYZE, BUFFERS)</tspan>
          <tspan fill="#F59E0B"> SELECT</tspan> u.username, o.slug, count(a.id)
        </text>
        <text y="34" fill="#F8FAFC">
          <tspan fill="#F59E0B">FROM</tspan> auth_user u <tspan fill="#F59E0B">JOIN</tspan> tenant_organization o <tspan fill="#F59E0B">ON</tspan> o.owner_id = u.id
        </text>
        <text y="54" fill="#F8FAFC">
          <tspan fill="#F59E0B">WHERE</tspan> u.is_active = <tspan fill="#10B981">true</tspan> <tspan fill="#F59E0B">GROUP BY</tspan> u.id, o.slug;
        </text>
        <text y="78" fill="#10B981">
          Execution Time: 1.12ms · Planning Time: 0.18ms · Shared Hit Blocks: 8
        </text>
      </g>
    </g>
  </g>
</svg>

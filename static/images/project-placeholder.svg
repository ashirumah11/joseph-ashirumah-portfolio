  <!-- Window mockup container -->
  <rect x="120" y="70" width="560" height="310" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="120" y="70" width="560" height="40" rx="12" fill="#1e293b"/>
  <!-- Window controls -->
  <circle cx="145" cy="90" r="5" fill="#ef4444"/>
  <circle cx="162" cy="90" r="5" fill="#f59e0b"/>
  <circle cx="179" cy="90" r="5" fill="#10b981"/>
  <!-- Window address bar -->
  <rect x="210" y="80" width="380" height="20" rx="4" fill="#090d16" stroke="rgba(255,255,255,0.08)"/>
  <text x="400" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">api.system.service/health</text>
  <!-- Mockup Architecture Diagram -->
  <rect x="160" y="140" width="130" height="75" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="225" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Django API</text>
  <text x="225" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee" text-anchor="middle">ORM &amp; Auth</text>

  <line x1="290" y1="177" x2="360" y2="177" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>

  <rect x="360" y="140" width="130" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="425" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>
  <text x="425" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60a5fa" text-anchor="middle">Relational Schema</text>

  <line x1="425" y1="215" x2="425" y2="260" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>

  <rect x="360" y="260" width="130" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="425" y="292" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Redis / Cache</text>
  <text x="425" y="312" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="middle">Task Broker</text>

  <line x1="225" y1="215" x2="225" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>

  <rect x="160" y="260" width="130" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="225" y="292" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Celery Worker</text>
  <text x="225" y="312" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">Async Pipeline</text>

  <rect x="520" y="140" width="130" height="195" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.15)"/>
  <text x="585" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Metrics &amp; UI</text>
  <rect x="535" y="195" width="100" height="12" rx="3" fill="#06b6d4" opacity="0.4"/>
  <rect x="535" y="220" width="80" height="12" rx="3" fill="#3b82f6" opacity="0.4"/>
  <rect x="535" y="245" width="90" height="12" rx="3" fill="#10b981" opacity="0.4"/>
  <rect x="535" y="270" width="60" height="12" rx="3" fill="#f59e0b" opacity="0.4"/>

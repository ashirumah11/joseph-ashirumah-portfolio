<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="av-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="av-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5524" />
      <stop offset="100%" stop-color="#6F3F19" />
    </linearGradient>
    <linearGradient id="av-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#av-bg)" />

  <!-- Subtle Blueprint Tech Ring -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#av-accent)" stroke-width="2" opacity="0.4" />

  <!-- Geometric Circuit Dots -->
  <circle cx="65" cy="110" r="4" fill="#38BDF8" />
  <line x1="65" y1="110" x2="105" y2="110" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
  <circle cx="335" cy="290" r="4" fill="#2563EB" />
  <line x1="295" y1="290" x2="335" y2="290" stroke="#2563EB" stroke-width="1" opacity="0.4" />

  <!-- Silhouette / Stylized Portrait -->
  <!-- Shoulders & Torso -->
  <path d="M 90 380 C 90 280, 140 250, 200 250 C 260 250, 310 280, 310 380 Z" fill="url(#av-shirt)" stroke="#334155" stroke-width="2" />
  <!-- Jacket Collar -->
  <path d="M 155 258 L 200 320 L 245 258" fill="none" stroke="#2563EB" stroke-width="2.5" />
  <!-- Inner shirt -->
  <polygon points="175,258 200,300 225,258" fill="#0F172A" />

  <!-- Neck -->
  <rect x="178" y="210" width="44" height="50" rx="6" fill="url(#av-skin)" />

  <!-- Head -->
  <ellipse cx="200" cy="165" rx="55" ry="68" fill="url(#av-skin)" />

  <!-- Hair -->
  <path d="M 142 160 C 142 105, 170 95, 200 95 C 230 95, 258 105, 258 160 C 255 130, 245 110, 200 110 C 155 110, 145 130, 142 160 Z" fill="#1C1917" />

  <!-- Modern Glasses / Frames -->
  <rect x="156" y="146" width="38" height="26" rx="6" fill="none" stroke="#38BDF8" stroke-width="3" />
  <rect x="206" y="146" width="38" height="26" rx="6" fill="none" stroke="#38BDF8" stroke-width="3" />
  <line x1="194" y1="158" x2="206" y2="158" stroke="#38BDF8" stroke-width="3" />
  <line x1="145" y1="156" x2="156" y2="156" stroke="#38BDF8" stroke-width="2.5" />
  <line x1="244" y1="156" x2="255" y2="156" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Beard & Smile -->
  <path d="M 168 190 Q 200 226, 232 190 Q 200 235, 168 190 Z" fill="#1C1917" opacity="0.8" />
  <path d="M 188 196 Q 200 204, 212 196" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Badge: Full-Stack Engineer -->
  <g transform="translate(90, 345)">
    <rect width="220" height="34" rx="17" fill="#0B1220" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="24" cy="17" r="4" fill="#10B981" />
    <text x="122" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">
      JOSEPH ASHIRUMAH
    </text>
  </g>
</svg>

        <text x="274" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">620 units</text>
        <rect x="364" y="10" width="68" height="18" rx="4" fill="#064E3B" />
        <text x="398" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6EE7B7" text-anchor="middle">IN STOCK</text>
      </g>
      <line x1="16" y1="198" x2="464" y2="198" stroke="#334155" stroke-width="0.8" />


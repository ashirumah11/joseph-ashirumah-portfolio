<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="dp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#111C35" />
    </linearGradient>
    <linearGradient id="dp-chart-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="dp-chart-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="dp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="540" fill="url(#dp-bg)" />

  <!-- Architectural Background Grid -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="60" x2="960" y2="60" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="300" x2="960" y2="300" />
    <line x1="0" y1="360" x2="960" y2="360" />
    <line x1="0" y1="420" x2="960" y2="420" />
    <line x1="0" y1="480" x2="960" y2="480" />
    <line x1="120" y1="0" x2="120" y2="540" />
    <line x1="240" y1="0" x2="240" y2="540" />
    <line x1="360" y1="0" x2="360" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="600" y1="0" x2="600" y2="540" />
    <line x1="720" y1="0" x2="720" y2="540" />
    <line x1="840" y1="0" x2="840" y2="540" />
  </g>

  <!-- Browser/Window Mockup Container -->
  <g transform="translate(40, 30)">
    <rect width="880" height="480" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="880" height="42" rx="12" fill="#1E293B" />
    <rect y="32" width="880" height="10" fill="#1E293B" />
    <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="60" cy="21" r="5.5" fill="#10B981" />

    <rect x="260" y="10" width="360" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="440" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
      https://devpulse.io/cluster/telemetry
    </text>

    <!-- Subheader / Status Bar -->
    <rect x="0" y="42" width="880" height="52" fill="#141E33" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
      DevPulse Dashboard
    </text>
    <rect x="180" y="61" width="94" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1" />
    <circle cx="192" cy="71" r="3.5" fill="#10B981" />
    <text x="235" y="75" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">
      HEALTHY
    </text>

    <text x="856" y="73" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="end">
      Workers: 16/16 · 14.2k req/s
    </text>

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <g transform="translate(24, 110)">
      <!-- Card 1 -->
      <rect width="195" height="85" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">AVG LATENCY (P99)</text>
      <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#38BDF8">28.4 ms</text>
      <text x="16" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10B981">↓ 12% vs last hour</text>

      <!-- Card 2 -->
      <rect x="215" width="195" height="85" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="231" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">CELERY QUEUE</text>
      <text x="231" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">142 jobs</text>
      <text x="231" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">0 failed · 4 retries</text>

      <!-- Card 3 -->
      <rect x="430" width="195" height="85" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="446" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">POSTGRES POOL</text>
      <text x="446" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#10B981">42 / 60</text>
      <text x="446" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6EE7B7">Active connections</text>

      <!-- Card 4 -->
      <rect x="645" width="187" height="85" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="661" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">CACHE HIT RATIO</text>
      <text x="661" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#A855F7">98.2%</text>
      <text x="661" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E9D5FF">Redis cluster</text>
    </g>

    <!-- Main Chart Section -->
    <g transform="translate(24, 212)">
      <rect width="520" height="244" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">
        Asynchronous Task Throughput &amp; Ingestion Rate
      </text>

      <!-- Chart grid lines -->
      <line x1="20" y1="60" x2="500" y2="60" stroke="#334155" stroke-dasharray="3" />
      <line x1="20" y1="105" x2="500" y2="105" stroke="#334155" stroke-dasharray="3" />
      <line x1="20" y1="150" x2="500" y2="150" stroke="#334155" stroke-dasharray="3" />
      <line x1="20" y1="195" x2="500" y2="195" stroke="#334155" stroke-dasharray="3" />

      <!-- Area Path -->
      <path d="M 20 180 Q 80 140, 140 160 T 260 90 T 380 110 T 500 70 L 500 215 L 20 215 Z" fill="url(#dp-chart-cyan)" />
      <!-- Line Path -->
      <path d="M 20 180 Q 80 140, 140 160 T 260 90 T 380 110 T 500 70" fill="none" stroke="#06B6D4" stroke-width="2.5" />
      <circle cx="500" cy="70" r="4" fill="#06B6D4" />

      <!-- Secondary Line -->
      <path d="M 20 200 Q 80 180, 140 170 T 260 140 T 380 150 T 500 120" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4" />

      <text x="20" y="232" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">12:00</text>
      <text x="140" y="232" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">12:15</text>
      <text x="260" y="232" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">12:30</text>
      <text x="380" y="232" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">12:45</text>
      <text x="490" y="232" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">13:00</text>
    </g>

    <!-- Side Terminal Logs -->
    <g transform="translate(560, 212)">
      <rect width="296" height="244" rx="8" fill="#0B1220" stroke="#334155" stroke-width="1" />
      <rect width="296" height="30" rx="8" fill="#141E33" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
        worker.telemetry.log
      </text>

      <g transform="translate(14, 46)" font-family="'JetBrains Mono', monospace" font-size="10">
        <text y="10" fill="#10B981">[INFO] worker-03 spawned</text>
        <text y="28" fill="#64748B">12:59:04 beat: sync_cluster_state</text>
        <text y="46" fill="#38BDF8">[200] GET /metrics 1.8ms</text>
        <text y="64" fill="#F8FAFC">task: aggregate_metrics</text>
        <text y="82" fill="#10B981">[SUCCESS] batch 8412 processed</text>
        <text y="100" fill="#64748B">12:59:22 redis: keepalive ok</text>
        <text y="118" fill="#F59E0B">[WARN] disk io spike: node-02</text>
        <text y="136" fill="#10B981">[RESOLVED] auto-balanced load</text>
        <text y="154" fill="#38BDF8">[200] POST /v1/events 3.1ms</text>
        <text y="172" fill="#64748B">12:59:58 worker poll idle</text>
      </g>
    </g>
  </g>
</svg>
